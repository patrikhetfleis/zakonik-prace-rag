services:
  - type: web
    name: zakonik-prace-rag
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: RATE_LIMIT_PER_MIN
        value: "5"
      - key: DAILY_LIMIT
        value: "300"
