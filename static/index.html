<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zákoník práce – RAG asistent</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --user-bubble: #38bdf8;
    --bot-bubble: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #334155;
  }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .msg {
    max-width: 75%;
    padding: 0.65rem 0.9rem;
    border-radius: 0.75rem;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #0f172a;
    border-bottom-right-radius: 0.15rem;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 0.15rem;
  }
  .msg.sources {
    align-self: flex-start;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: -0.5rem;
  }

  form {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid #334155;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border-radius: 0.6rem;
    border: 1px solid #334155;
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
  }
  button {
    padding: 0.7rem 1.2rem;
    border-radius: 0.6rem;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>🇨🇿 Zákoník práce – RAG asistent</h1>
  <p>Demo aplikace: odpovídá na dotazy nad aktuálním zněním zákona č. 262/2006 Sb. Není to právní poradenství.</p>
</header>

<div id="chat"></div>

<form id="chat-form">
  <input type="text" id="question" placeholder="Např.: Jak dlouhá je zkušební doba?" autocomplete="off" />
  <button type="submit" id="send-btn">Zeptat se</button>
</form>

<script>
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;
    const loadingEl = addMessage("Přemýšlím...", "bot");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      if (!res.ok) {
        loadingEl.textContent = "Chyba: " + (data.detail || res.statusText);
        return;
      }

      loadingEl.textContent = data.answer;
      if (data.sources && data.sources.length) {
        addMessage("Zdroje: " + data.sources.join(", "), "sources");
      }
    } catch (err) {
      loadingEl.textContent = "Nepodařilo se spojit se serverem.";
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>

</body>
</html>
